<!doctype html>
<html lang="%lang%">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#131316" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
		<link rel="manifest" href="/manifest.json" />
		<link rel="icon" href="/icon-192.svg" type="image/svg+xml" />
		<link rel="apple-touch-icon" href="/icon-192.svg" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents" data-vaul-drawer-wrapper>%sveltekit.body%</div>
		<script>
			if ('serviceWorker' in navigator) {
				navigator.serviceWorker.register('/sw.js').then(function (reg) {
					// Register periodic sync for installed PWA (Chrome)
					if (reg.periodicSync) {
						reg.periodicSync.register('sync-periodic', { minInterval: 60 * 60 * 1000 });
					}
				});
			}
		</script>
	</body>
</html>
