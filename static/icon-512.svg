<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
	<defs>
		<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0%" stop-color="#141825"/>
			<stop offset="100%" stop-color="#0e1120"/>
		</linearGradient>
		<filter id="glow">
			<feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
			<feMerge>
				<feMergeNode in="blur"/>
				<feMergeNode in="SourceGraphic"/>
			</feMerge>
		</filter>
	</defs>

	<rect width="512" height="512" fill="url(#bg)"/>

	<g filter="url(#glow)">
		<!-- Bar 2 (behind, shorter, wider, mint green) -->
		<rect x="195" y="220" width="170" height="171" rx="24" fill="rgba(120,210,170,0.65)"/>

		<!-- Bar 1 (front, taller, narrower, lavender) -->
		<rect x="138" y="120" width="110" height="271" rx="22" fill="rgba(160,140,220,0.8)" />
	</g>
</svg>
